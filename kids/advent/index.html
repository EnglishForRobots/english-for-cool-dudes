  for(k=0;k<hb.length;k++)hb[k].onclick=null;
  AR.used.push(AR.sel);if(res>0)AR.win++;snd(res>0?'win':res<0?'err':'boing');
  $('stb').innerHTML='<div class="big pun">'+['Silly','Sparkle','Snacks'][s]+': '+a+' vs '+b+'<br>'+(res>0?'YOU WIN THIS ROUND! 🎉':res<0?'The opponent wins this one 😬':'A tie! Both cards giggle 😂')+'</div><button class="bt pk" id="an">'+(AR.rd<2?'Next round →':'See the result →')+'</button>';
  $('an').onclick=function(){AR.rd++;if(AR.rd>=3)arenaEnd();else arenaRound();};
}
function arenaEnd(){
  var w=AR.win,sweep=(w===3),coins=w>=2?(sweep?12:8):2,r0=rank();
  P.coins+=coins;if(w>=2)P.wins=(P.wins|0)+1;save();
  if(rank()!==r0)toast('🏅 NEW RANK: '+rank()+'!');
  $('mb').innerHTML=head('⚔️','Battle over!',w+' of 3 rounds won')+'<div class="gt" style="font-size:26px">'+(w>=2?'🏆 VICTORY!':'😅 Good fight!')+'</div><div class="say">'+(sweep?'A perfect 3-0 sweep! The elves are chanting your name!':w>=2?'You beat the Arena champion!':'The opponent got lucky. Pick a different team and try again!')+'</div><div class="nx2">You earned +'+coins+' ❄️ (you have '+P.coins+')</div><button class="bt pk" onclick="arenaOpen()">⚔️ Battle again</button><button class="bt" style="background:#8b5cf6;border-bottom-color:#5b21b6" onclick="shopOpen()">🛒 Visit the shop</button><button class="sk" style="display:block;margin:10px auto" onclick="mClose()">Back to the calendar</button>';
  if(w>=2){snd('legend');confetti(innerWidth/2,200);big('🏆');}else snd('boing');
}

/* ═══ SHOP + TRADE-UP ═══ */
var PACK_COST=15,TRADES=[['Common','Rare',3],['Rare','Epic',3],['Epic','Legendary',4]];
function spares(rar){var s=0,i;for(i=0;i<CARDS.length;i++)if(CARDS[i].r===rar&&(P.cards[i]|0)>1)s+=P.cards[i]-1;return s;}
function shopOpen(){
  var rows='',i,sp,ok;ac();DM={n:0,i:0,steps:[]};mOpen();
  for(i=0;i<TRADES.length;i++){sp=spares(TRADES[i][0]);ok=sp>=TRADES[i][2];rows+='<button class="bt'+(ok?' pk':'')+'"'+(ok?'':' disabled')+' data-i="'+i+'">♻️ Trade '+TRADES[i][2]+' spare '+TRADES[i][0]+'s → 1 '+TRADES[i][1]+' <small>('+sp+' spare)</small></button>';}
  $('mb').innerHTML=head('🛒','The Shop','You have '+P.coins+' ❄️ snowflakes')+'<div class="nx2">Earn ❄️ by finishing doors (+5), winning Arena battles (+8) and extra surprises (+1).</div><button class="bt'+(P.coins>=PACK_COST?' pk':'')+'" id="bp"'+(P.coins>=PACK_COST?'':' disabled')+'>🎴 Open a card pack ('+PACK_COST+' ❄️)</button><div class="gs">Got duplicates? Trade them up!</div>'+rows+'<button class="sk" style="display:block;margin:10px auto" onclick="mClose()">Back to the calendar</button>';
  $('bp').onclick=function(){if(P.coins<PACK_COST)return;P.coins-=PACK_COST;save();DM={n:0,i:0,steps:[{k:'pack',r:rr(),shop:true}]};stepDraw();};
  onAll('#mb button[data-i]',function(e){tradeUp(parseInt(e.getAttribute('data-i'),10));});
}
function tradeUp(i){
  var T=TRADES[i],left=T[2],k,pool=[],id,nw;
  if(spares(T[0])<T[2])return;
  for(k=0;k<CARDS.length&&left>0;k++)if(CARDS[k].r===T[0])while((P.cards[k]|0)>1&&left>0){P.cards[k]--;left--;}
  for(k=0;k<CARDS.length;k++)if(CARDS[k].r===T[1])pool.push(k);
  id=pool[Math.floor(Math.random()*pool.length)];nw=!P.cards[id];P.cards[id]=(P.cards[id]||0)+1;save();snd('legend');confetti(innerWidth/2,250);
  $('mb').innerHTML=head('♻️','Trade-up!','Spare cards become better cards')+'<div class="gt">✨ You got a '+T[1]+' card!</div><div class="pk3"><button class="cdb on '+RC[CARDS[id].r]+'">'+faceHtml(CARDS[id],nw,false)+'</button></div><button class="bt pk" onclick="shopOpen()">Back to the shop</button>';
}

/* ═══ SNOW ═══ */
(function(){
  var c=$('snow'),x=c.getContext&&c.getContext('2d'),W,H,F=[],i;if(!x)return;
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}rs();window.addEventListener('resize',rs);
  for(i=0;i<50;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:.4+Math.random()*1.1,d:Math.random()*6});
  (function f(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';
    for(var k=0;k<F.length;k++){var p=F[k];p.y+=p.s;p.d+=.02;p.x+=Math.sin(p.d)*.5;if(p.y>H){p.y=-5;p.x=Math.random()*W;}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();}
    (window.requestAnimationFrame||function(g){setTimeout(g,40);})(f);})();
})();

/* ═══ START ═══ */
function applySkin(){
  var sk=SKINS[P.skin]||SKINS.m;document.body.className='sk-'+(P.skin||'m');
  $('tg').innerHTML=sk.tag;$('h1').innerHTML=sk.h;$('ef').textContent=sk.m;buildCards();
}
function welcome(styleOnly){
  DM={n:0,i:0,steps:[]};mOpen();
  $('mb').innerHTML='<div class="mh"><span class="me">🎄</span><div><b>Welcome to the Chaos Calendar!</b><small>Pick your style</small></div></div><div class="say">The whole calendar will transform to match your style!</div><button class="opt" data-s="g">👧 Girl style<small style="display:block;font-weight:600">sparkles, unicorns &amp; glitter</small></button><button class="opt" data-s="b">👦 Boy style<small style="display:block;font-weight:600">robots, dragons &amp; epic battles</small></button><button class="opt" data-s="m">🌈 Mix it up<small style="display:block;font-weight:600">a bit of everything</small></button>'+(styleOnly?'<button class="sk" style="display:block;margin:8px auto" onclick="mClose()">Cancel</button>':'');
  onAll('.opt',function(e){P.skin=e.getAttribute('data-s');applySkin();save();ac();snd('win');confetti(innerWidth/2,200);if(styleOnly){mClose();banter();toast('Style changed! '+SKINS[P.skin].m);}else nameStep();});
}
function nameStep(){
  var sk=SKINS[P.skin]||SKINS.m;
  $('mb').innerHTML='<div class="mh"><span class="me">'+sk.m+'</span><div><b>Hi! I’m '+sk.n+'!</b><small>Your Chaos Guide</small></div></div><div class="say">What’s your name? I’ll use it in jokes and fortunes. It stays on this device only!</div><div class="cin"><input id="wn" placeholder="Your name" maxlength="14"><button id="wg">That’s me!</button></div><button class="sk" style="display:block;margin:6px auto" id="ws">I’ll stay mysterious</button>';
  function go(v){P.name=String(v||'').replace(/^\s+|\s+$/g,'');save();snd('bell');mClose();banter();toast('Welcome'+(P.name?', '+P.name:'')+'! 🎄');}
  $('wg').onclick=function(){ac();go($('wn').value);};$('ws').onclick=function(){ac();go('');};
}
document.addEventListener('DOMContentLoaded',function(){
  PLAN=mkPlan();applySkin();render();banter();tick();setInterval(tick,1000);
  if(!P.skin)welcome(false);
});
</script>
