<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Drop Review — English For Cool Dudes</title>
<link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2e5a;--yellow:#FFC800;--ys:#E5B400;--green:#58CC02;--gs:#58A700;--punch:#FF4B4B;--ps:#EA2B2B;--blue:#1CB0F6;--bg:#F7F9FA;--ink:#4B4B4B;--bold:#111827;--mute:#8A8F98;--line:#CECECE;--r:22px;--rs:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:3px solid #E5E5E5;height:56px;display:flex;align-items:center;padding:0 16px}
header a{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--bold);text-decoration:none;font-size:15px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--yellow);border:2px solid var(--ys);border-bottom:4px solid var(--ys);display:flex;align-items:center;justify-content:center;font-size:20px}
main{max-width:620px;margin:0 auto;padding:20px 14px 60px}
.card{background:#fff;border:2px solid var(--line);border-bottom:6px solid var(--line);border-radius:var(--r);padding:22px 18px;margin-bottom:14px}
.center{text-align:center}
.eyebrow{font-size:13px;font-weight:800;color:var(--mute);margin-bottom:8px}
h1{font-size:clamp(22px,6vw,30px);font-weight:900;color:var(--bold);letter-spacing:-.8px;line-height:1.2;margin-bottom:8px}
.sub{font-size:15px;font-weight:700;color:var(--mute);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;font:inherit;font-size:16px;font-weight:900;border-radius:var(--rs);border:2px solid;border-bottom:5px solid;cursor:pointer;text-decoration:none;margin-top:10px}
.btn:active{border-bottom-width:2px;transform:translateY(3px)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.y{background:var(--yellow);color:var(--bold);border-color:var(--ys)}
.n{background:var(--navy);color:#fff;border-color:#0d1a35}
.w{background:#fff;color:var(--bold);border-color:var(--line)}
.pips{display:flex;gap:5px;margin-bottom:16px}
.pip{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pip.r{background:var(--green)}.pip.x{background:var(--punch)}.pip.a{background:var(--yellow)}
.q{font-size:clamp(17px,4.4vw,20px);font-weight:800;color:var(--bold);line-height:1.5;margin-bottom:6px}
.hint{font-size:13px;font-weight:700;color:var(--mute);font-style:italic;margin-bottom:14px}
.gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--yellow);text-align:center;color:#8a6800}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:13px 15px;font:inherit;font-size:15px;font-weight:800;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-bottom:4px solid var(--line);border-radius:var(--rs);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--green);color:#fff;border-color:var(--gs);animation:beat .5s}
.opt.no{background:var(--punch);color:#fff;border-color:var(--ps);animation:shake .4s}
.opt.show{background:rgba(88,204,2,.12);color:var(--gs);border-color:var(--gs)}
.tray{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;margin:12px 0;border:2px dashed var(--line);border-radius:var(--rs);background:#fff}
.tray.ok{border-style:solid;border-color:var(--gs);background:rgba(88,204,2,.08)}
.tray.no{border-style:solid;border-color:var(--ps);background:rgba(255,75,75,.08)}
.empty{color:var(--mute);font-size:14px;font-weight:700}
.chip,.tile{font:inherit;font-size:15px;font-weight:800;border-radius:10px;padding:9px 12px;cursor:pointer}
.chip{background:#EAF6FE;color:var(--bold);border:2px solid var(--blue)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;color:var(--ink);border:2px solid var(--line);border-bottom:4px solid var(--line)}
.tile:disabled{opacity:.25;cursor:default}
.tile.flash{border-color:var(--blue);background:#EAF6FE}
.l{text-transform:uppercase;min-width:42px;text-align:center;font-size:18px}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1;margin-top:0;padding:10px;font-size:14px}
.fb{display:none;margin-top:12px;padding:12px 14px;border-radius:var(--rs);font-size:14px;font-weight:700;line-height:1.55;border:2px solid}
.fb.r{display:block;background:rgba(88,204,2,.1);color:#3f7d00;border-color:rgba(88,167,0,.3)}
.fb.x{display:block;background:rgba(255,75,75,.1);color:#c21f1f;border-color:rgba(255,75,75,.3)}
.big{font-size:64px;display:block;line-height:1.1;margin-bottom:8px}
.score{font-size:48px;font-weight:900;color:var(--bold);line-height:1}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.opt{animation:none!important}}
</style>
</head>
<body>
<header><a href="/weeklydrop/"><span class="logo">😎</span>The Weekly Drop</a></header>
<main id="app"></main>

<script>
'use strict';
(function () {
  var app = document.getElementById('app');
  var $ = function (id) { return document.getElementById(id); };
  var shuf = function (a) { return a.slice().sort(function () { return Math.random() - .5; }); };
  var take = function (a, n) { return shuf(a).slice(0, n); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var norm = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); };
  var pref = function (a, f) { var g = a.filter(f); return g.length ? g : a; };

  /* ?issue=020 (or 20) */
  var n = parseInt(new URLSearchParams(location.search).get('issue'), 10);
  var num = n > 0 ? String(n).padStart(3, '0') : '';
  var reg = null, Q = [], i = 0, score = 0;

  /* ---------- question constructors ---------- */
  function mc(kind, q, hint, opts, correct, fb) {
    return { t: 'mc', kind: kind, q: q, hint: hint || '', opts: opts, correct: correct, fb: fb || '' };
  }
  function bd(kind, q, hint, items, show, accepts, join) {
    return { t: 'bd', kind: kind, q: q, hint: hint, items: items, answer: show, accepts: accepts, join: join };
  }

  /* Turn the registry entry into one mixed list of questions */
  function build(r) {
    var toks = function (a) { return a.map(norm).filter(Boolean).sort().join('|'); };
    var solvable = function (e) { return e.words && e.answer && toks(e.words) === toks(String(e.answer).split(' ')); };

    var v = (r.vocab || []).filter(function (x) { return x.example && x.distractors && x.distractors.length; }).map(function (x) {
      var o = shuf([x.word].concat(x.distractors));
      return mc('Vocabulary', x.example, 'Which word fits the gap?', o, o.indexOf(x.word), x.definition);
    });
    var g = [r.grammar, r.grammar2, r.grammar3].filter(Boolean).reduce(function (acc, t) {
      return acc.concat((t.exercises || []).map(function (e) {
        var o = shuf([e.answer].concat(e.wrong || []));
        return mc('Grammar: ' + t.topic, e.sentence, e.hint || 'Pick the correct form.', o, o.indexOf(e.answer), e.explain || e.answer);
      }));
    }, []);
    var t = (r.true_false || []).map(function (e) {
      return mc('True or false?', e.statement, '', ['True', 'False'], e.correct ? 0 : 1, e.reveal);
    });
    var f = (r.fix_mistakes || []).map(function (e) {
      if (e.opts) return mc('Fix the mistake', e.sentence, e.hint, e.opts, e.correct, e.fb || e.explain);
      if (e.wrong && typeof e.correct === 'string') {
        var good = e.wrong + ' → ' + e.correct;
        var o = shuf([good, e.wrong + ' → KEEP AS IS']);
        return mc('Fix the mistake', e.sentence, e.hint, o, o.indexOf(good), e.explain);
      }
      return null;
    }).filter(Boolean);
    var x = [].concat(r.quiz_boss || [], r.beat_clock || []).filter(function (e) { return e.opts; }).map(function (e) {
      return mc('Quick quiz', e.q, '', e.opts, e.correct, '');
    });
    var s = pref((r.sentences || []).filter(solvable), function (e) { return e.words.length <= 12; }).map(function (e) {
      return bd('Build the sentence', e.hint || 'Put the words in the right order.', 'Tap the words in order. Tap a placed word to take it back.',
        shuf(e.words), e.answer, [e.answer].concat(e.altAnswers || []).map(norm), ' ');
    });
    var seen = {};
    var w = pref((r.word_builder || []).filter(function (e) {
  var k = e.word.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true;
}), function (e) { return e.word.replace(/[^a-z0-9]/gi, '').length <= 11; }).map(function (e) {
  var letters = norm(e.word).replace(/ /g, '');
  var items = [], groups = [], cur = [], grp = null;
  function flush() {
    if (!cur.length) return;
    if (!grp) { grp = []; groups.push(grp); }
    shuf(cur).forEach(function (l) { grp.push(items.length); items.push(l); });
    cur = [];
  }
  e.word.toLowerCase().split('').forEach(function (ch) {
    if (/[a-z0-9]/.test(ch)) cur.push(ch);
    else if (ch !== "'" && ch !== '’') {          // space or hyphen becomes its own tile
      flush();
      if (!grp) { grp = []; groups.push(grp); }
      grp.push(items.length); items.push(ch);
      grp = null;
    }
  });
  flush();
  var q = bd('Spell the word', e.definition, 'Tap the letters to spell the word.', items, e.word, [letters], '');
    q.groups = groups;
  return q;
});

    return shuf([].concat(take(v, 4), take(g, 4), take(t, 2), take(f, 2), take(x, 2), take(s, 2), take(w, 3)));
  }

  /* ---------- screens ---------- */
  function msg(icon, title, sub, btn) {
    app.innerHTML = '<div class="card center"><span class="big">' + icon + '</span><h1>' + title + '</h1><p class="sub">' + sub + '</p>' + (btn || '') + '</div>';
  }
  function notFound() { msg('🕵️', 'Review not found', 'We couldn’t find that issue. Pick one from the archive.', '<a class="btn y" href="/weeklydrop/">See all issues</a>'); }

  function intro() {
    var title = reg.title || ('The Weekly Drop, Issue ' + num);
    document.title = 'Review: ' + title;
    app.innerHTML = '<div class="card"><div class="eyebrow">Weekly Drop review</div><h1>' + esc(title) + '</h1>' +
      '<p class="sub">' + Q.length + ' quick questions, about ' + Math.max(1, Math.round(Q.length / 4)) + ' minutes. No sign-up needed. How much do you remember?</p>' +
      '<button class="btn y" id="go">Start the review</button></div>';
    $('go').onclick = function () { i = 0; score = 0; show(); };
  }

  function show() {
    var q = Q[i];
    var pips = Q.map(function (_, k) { return '<div class="pip' + (k === i ? ' a' : '') + '"></div>'; }).join('');
    var hint = q.hint ? '<div class="hint">' + esc(q.hint) + '</div>' : '<div style="height:12px"></div>';
    var body = q.t === 'bd'
      ? '<div class="q">' + esc(q.q) + '</div>' + hint +
        '<div class="tray" id="tray"></div><div class="bank" id="bank"></div>' +
        '<div id="ctl"><div class="row"><button class="btn w" id="clr">Clear</button><button class="btn w" id="hnt">Hint</button><button class="btn w" id="rev">Reveal</button></div>' +
        '<button class="btn y" id="chk">Check</button></div>'
      : '<div class="q">' + q.q.replace(/_{3,}/g, '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>') + '</div>' + hint + '<div class="opts" id="opts"></div>';
    app.innerHTML = '<div class="card"><div class="pips">' + pips + '</div><div class="eyebrow">' + esc(q.kind) + ' (' + (i + 1) + ' of ' + Q.length + ')</div>' +
      body + '<div class="fb" id="fb" role="status"></div><div id="nx"></div></div>';
    if (q.t === 'bd') initBd(q); else initMc(q);
  }

  /* shared: record result, show feedback and the Next button */
  function done(ok, text) {
    if (ok) score++;
    app.querySelectorAll('.pip')[i].className = 'pip ' + (ok ? 'r' : 'x');
    var fb = $('fb');
    fb.className = 'fb ' + (ok ? 'r' : 'x');
    fb.textContent = text;
    var last = i === Q.length - 1;
    $('nx').innerHTML = '<button class="btn y" id="nb">' + (last ? 'See my score' : 'Next question') + '</button>';
    $('nb').focus();
    $('nb').onclick = function () { i++; if (i < Q.length) show(); else finish(); };
  }

  /* ---------- multiple choice ---------- */
  function initMc(q) {
    var box = $('opts');
    q.opts.forEach(function (o, k) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = o;
      b.onclick = function () { answer(k); };
      box.appendChild(b);
    });
  }
  function fillGaps(ans) {
    var gs = app.querySelectorAll('.gap'), c = gs.length;
    var parts = ans.indexOf(' / ') > -1 ? ans.split(' / ') : null, ws = ans.split(' ');
    Array.prototype.forEach.call(gs, function (g, m) {
      g.textContent = parts ? (parts[m] || parts[0]) : c <= 1 ? ans : m === c - 1 ? (ws.slice(m).join(' ') || ans) : (ws[m] || '');
    });
  }
  function answer(k) {
    var q = Q[i], ok = k === q.correct, bs = $('opts').children;
    Array.prototype.forEach.call(bs, function (b) { b.disabled = true; });
    bs[k].classList.add(ok ? 'ok' : 'no');
    if (!ok) bs[q.correct].classList.add('show');
    fillGaps(String(q.opts[q.correct]));
    done(ok, (ok ? '✅ ' : '💡 ') + (q.fb || (ok ? 'Correct!' : 'The right answer is highlighted.')));
  }

  /* ---------- tap-to-build (sentences and spelling) ---------- */
  function initBd(q) {
    var placed = [], fin = false, tray = $('tray'), bank = $('bank');
    var cls = q.join ? '' : ' l';
    var disp = function (t) { return t === ' ' ? ' ' : t; };
function mk(t, k) {
  var b = document.createElement('button');
  b.className = 'tile' + cls; b.id = 't' + k; b.textContent = disp(t);
  b.onclick = function () { if (!fin) { placed.push(k); draw(); } };
  return b;
}
if (q.groups) {
  bank.style.gap = '10px 24px';
  q.groups.forEach(function (g) {
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;gap:8px';
    g.forEach(function (k) { d.appendChild(mk(q.items[k], k)); });
    bank.appendChild(d);
  });
} else {
  q.items.forEach(function (t, k) { bank.appendChild(mk(t, k)); });
}
  
    function draw() {
      $('fb').className = 'fb';
      tray.innerHTML = placed.length ? '' : '<span class="empty">Your answer appears here</span>';
      placed.forEach(function (k, p) {
        var c = document.createElement('button');
        c.className = 'chip' + cls; c.textContent = q.items[k] === ' ' ? '␣' : q.items[k];
        c.onclick = function () { if (!fin) { placed.splice(p, 1); draw(); } };
        tray.appendChild(c);
      });
      q.items.forEach(function (_, k) { $('t' + k).disabled = fin || placed.indexOf(k) > -1; });
    }
    function end(ok) {
      fin = true; draw();
      tray.className = 'tray ' + (ok ? 'ok' : 'no');
      $('ctl').style.display = 'none';
      done(ok, ok ? '✅ Correct!' : '💡 Answer: ' + q.answer);
    }
    $('chk').onclick = function () {
      if (fin || !placed.length) return;
      var built = placed.map(function (k) { return q.items[k]; }).join(q.join);
      var key = q.join ? norm(built) : norm(built).replace(/ /g, '');
      end(q.accepts.indexOf(key) > -1);
    };
    $('clr').onclick = function () { if (!fin) { placed = []; draw(); } };
    $('rev').onclick = function () { if (!fin) { placed = []; end(false); } };
    $('hnt').onclick = function () {
      if (fin) return;
      var units = q.join ? q.accepts[0].split(' ') : q.accepts[0].split('');
      var real = placed.filter(function (k) { return norm(q.items[k]).trim() !== ''; });
var okSoFar = real.every(function (k, p) { return norm(q.items[k]) === units[p]; });
      if (!okSoFar) { var f = $('fb'); f.className = 'fb x'; f.textContent = 'Something is out of place. Tap a placed item to take it back.'; return; }
      for (var k = 0; k < q.items.length; k++) {
        if (placed.indexOf(k) < 0 && norm(q.items[k]) === units[real.length]) {
          var b = $('t' + k); b.classList.add('flash');
          setTimeout(function () { b.classList.remove('flash'); }, 1500);
          return;
        }
      }
    };
    draw();
  }

  /* ---------- finish ---------- */
  function finish() {
    var p = score / Q.length;
    var r = p === 1 ? ['🏆', 'Flawless!', 'Everything from the issue stuck. Impressive.']
      : p >= .7 ? ['🌟', 'Strong recall!', 'Most of it stuck. One more go will lock in the rest.']
      : p >= .4 ? ['👍', 'Good start!', 'Some of it stuck. Skim the issue again, then replay.']
      : ['💪', 'Worth another go', 'Pulling words back from memory is hard. That effort is what makes them stick.'];
    app.innerHTML = '<div class="card center"><span class="big">' + r[0] + '</span><div class="score">' + score + '/' + Q.length + '</div>' +
      '<h1 style="margin-top:12px">' + r[1] + '</h1><p class="sub">' + r[2] + '</p>' +
      '<button class="btn y" id="again">Play again</button>' +
      '<a class="btn w" href="/weeklydrop' + num + '/">Read the full issue</a></div>' +
      '<div class="card center"><h1 style="font-size:20px">Want every drop as a game?</h1>' +
      '<p class="sub">A free account saves your badges and streaks, and brings words back just before you forget them.</p>' +
      '<a class="btn n" href="/signup/">Join free</a></div>';
    $('again').onclick = function () { Q = build(reg); i = 0; score = 0; show(); };
  }

  /* ---------- load the registry after the page shell appears ---------- */
  if (!num) { notFound(); return; }
  msg('⏳', 'Loading the review', 'Just a moment…');
  var s = document.createElement('script');
  s.src = '/lesson-data-registry.js';
  s.onload = function () {
    reg = window.LESSON_DATA_REGISTRY && window.LESSON_DATA_REGISTRY['weekly-drop-issue-' + num];
    if (!reg) { notFound(); return; }
    Q = build(reg);
    if (!Q.length) { notFound(); return; }
    intro();
  };
  s.onerror = function () {
    msg('📡', 'Couldn’t load the review', 'Check your connection and try again.', '<button class="btn y" onclick="location.reload()">Try again</button>');
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
